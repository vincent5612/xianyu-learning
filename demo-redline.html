<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则红线 · 图文演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    background: #f5f3ee;
    color: #1d1d1f;
    padding: 30px 16px;
  }
  h1 {
    text-align: center;
    font-size: 1.3em;
    color: #dc2626;

  }
  .sub {

    font-size: 0.85em;

    margin-bottom: 24px;
  }
  .gallery {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .gallery img {
    width: 100%;
    border-radius: 10px;

  .back-wrap {

    margin: 30px auto;
    max-width: 700px;
  }
  .back-btn {
    display: inline-block;
    background: #ffe411;
    color: #1a1a2e;
    padding: 10px 32px;
    border-radius: 24px;
    font-size: 0.95em;
    font-weight: 700;
    font-family: Georgia, 'Times New Roman', serif;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: box-shadow 0.2s;
    letter-spacing: 1px;
  }
  .back-btn:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.2); }
  .back-sub {
    text-align: center;
    font-size: 0.78em;

    margin-top: 6px;

<body>

  <div>
    <img src="images/redline-04.jpg" alt="红线4">

  </div>
  <div>
    <img src="images/redline-05.jpg" alt="红线5">

</div>

<div class="back-wrap">
  <a href="index.html#d1-rules" class="back-btn">← 返回培训手册</a>
