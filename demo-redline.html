<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规则红线 · 图文演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "SF Pro Display", "Noto Sans SC", sans-serif;
    background: #f5f3ee;
    color: #1d1d1f;
    padding: 30px 16px;
  }
  h1 {
    text-align: center;
    font-size: 1.3em;
    color: #dc2626;
    margin-bottom: 6px;
  }
  .sub {
    text-align: center;
    font-size: 0.85em;
    color: #6b7280;
    margin-bottom: 24px;
  }
  .gallery {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .gallery img {
    width: 100%;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    display: block;
    background: #fff;
  }
  .gallery .label {
    text-align: center;
    font-size: 0.82em;
    color: #6b7280;
    margin-top: 4px;
  }
  .back {
    display: block;
    text-align: center;
    margin: 24px auto 0;
    max-width: 700px;
  }
  .back a {
    color: #0f3460;
    text-decoration: none;
    font-size: 0.85em;
  }
  .back a:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>🚨 规则红线 · 图文演示</h1>
<p class="sub">闲鱼运营绝对不能触碰的 5 条红线 — 共 5 张</p>

<div class="gallery">
  <div>
    <img src="images/redline-01.jpg" alt="红线1">
    <div class="label">红线 1/5</div>
  </div>
  <div>
    <img src="images/redline-02.jpg" alt="红线2">
    <div class="label">红线 2/5</div>
  </div>
  <div>
    <img src="images/redline-03.jpg" alt="红线3">
    <div class="label">红线 3/5</div>
  </div>
  <div>
    <img src="images/redline-04.jpg" alt="红线4">
    <div class="label">红线 4/5</div>
  </div>
  <div>
    <img src="images/redline-05.jpg" alt="红线5">
    <div class="label">红线 5/5</div>
  </div>
</div>

<div class="back"><a href="index.html">← 返回培训手册</a></div>

</body>
</html>
