<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安叔产品商店</title>
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --border: #e8eaed;
  --accent: #FF8A00;
  --accent2: #E06A00;
  --accent-dim: rgba(255,138,0,0.08);
  --text: #1f2329;
  --text-dim: #6b7280;
  --text-muted: #9aa1ab;
  --green: #16a34a; --green-bg: #f0fdf4;
  --blue: #2563eb; --blue-bg: #eff6ff;
  --red: #dc2626; --red-bg: #fef2f2;
  --purple: #7c3aed; --purple-bg: #f5f3ff;
  --teal: #0d9488; --teal-bg: #f0fdfa;
  --amber: #d97706; --amber-bg: #fffbeb;
  --shadow-sm: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  --shadow-lg: 0 10px 30px rgba(16,24,40,0.12), 0 4px 8px rgba(16,24,40,0.06);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  background: var(--bg); color: var(--text);
  max-width: 920px; margin: 0 auto; padding: 22px 16px 64px;
}
/* 顶部 Hero */
.hero {
  background: linear-gradient(135deg,#191a1f 0%,#2b2519 100%);
  border-radius:20px; padding:30px 26px 26px; color:#fff; margin-bottom:14px;
  position:relative; overflow:hidden;
}
.hero::before { content:""; position:absolute; right:-50px; top:-50px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,138,0,0.20), transparent 70%); }
.hero::after { content:""; position:absolute; right:-30px; bottom:-70px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(255,138,0,0.10), transparent 70%); }
.hero .eyebrow { font-size:11px; color:#ffb454; letter-spacing:4px; font-weight:600; position:relative; }
.hero h1 { font-size:28px; font-weight:900; margin-top:8px; position:relative; letter-spacing:1px; }
.hero h1 .ul { display:inline-block; width:42px; height:4px; border-radius:3px; background:linear-gradient(90deg,var(--accent),#ffd089); vertical-align:middle; margin-left:10px; }
.hero .sub { font-size:13px; color:rgba(255,255,255,0.62); margin-top:10px; line-height:1.7; position:relative; }
.hero .count { font-size:12px; color:rgba(255,255,255,0.45); margin-top:14px; position:relative; }
/* 服务说明（客户友好，不含内部定价逻辑） */
.service-note {
  background:#fff; border:1px solid var(--border); border-left:4px solid var(--accent);
  border-radius:12px; padding:13px 18px; margin-bottom:16px;
  font-size:12px; color:var(--text-dim); line-height:1.7; box-shadow:var(--shadow-sm);
}
.service-note b { color:var(--accent2); }
/* 分类筛选栏 */
.filterbar {
  display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:6px;
  scrollbar-width:none;
}
.filterbar::-webkit-scrollbar { display:none; }
.fpill {
  flex:0 0 auto; border:1px solid var(--border); background:#fff; color:var(--text-dim);
  font-size:12px; font-weight:600; padding:7px 15px; border-radius:20px; cursor:pointer;
  white-space:nowrap; transition:all .15s; box-shadow:var(--shadow-sm);
}
.fpill:hover { border-color:#ffd9a8; color:var(--accent2); }
.fpill.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:var(--accent2); }
/* 产品网格 */
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.product {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:20px 18px; box-shadow:var(--shadow-sm); cursor:pointer; position:relative; overflow:hidden;
  transition:box-shadow .18s, transform .18s, border-color .18s; display:flex; flex-direction:column;
}
.product::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--cat-color,#ccc); border-radius:16px 16px 0 0; opacity:.85; }
.product:hover { box-shadow:var(--shadow-lg); transform:translateY(-3px); border-color:#ffd9a8; }
.p-icon { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:23px; margin-bottom:13px; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.03); }
.p-cat { font-size:10px; font-weight:700; letter-spacing:1px; margin-bottom:5px; }
.p-name { font-size:15px; font-weight:800; margin-bottom:5px; line-height:1.35; }
.p-desc { font-size:12px; color:var(--text-dim); line-height:1.65; flex:1; }
.p-price { font-size:18px; font-weight:900; color:var(--accent2); margin-top:13px; }
.p-price .unit { font-size:11px; color:var(--text-muted); font-weight:400; }
.p-badge { font-size:10px; padding:3px 10px; border-radius:20px; font-weight:600; display:inline-block; margin-top:9px; align-self:flex-start; }
.badge-hot { background:var(--red-bg); color:var(--red); }
.badge-new { background:var(--green-bg); color:var(--green); }
.badge-soon { background:var(--amber-bg); color:var(--amber); }
/* 弹窗 */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(16,24,40,0.5); z-index:1000; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
.modal-overlay.active { display:flex; }
.modal { background:#fff; border-radius:18px; width:100%; max-width:640px; max-height:90vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:modalIn .25s ease; }
@keyframes modalIn { 0%{opacity:0;transform:translateY(20px) scale(.98)} 100%{opacity:1;transform:translateY(0) scale(1)} }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid #f1f2f4; }
.modal-title { font-size:16px; font-weight:800; }
.modal-close { border:none; background:#f3f4f6; width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px; color:var(--text-dim); transition:background .15s; }
.modal-close:hover { background:#e9eaee; }
.modal-body { padding:22px; overflow-y:auto; font-size:13px; line-height:1.8; }
.modal-body h4 { font-size:13px; color:var(--accent2); margin:18px 0 9px; }
.modal-body h4:first-child { margin-top:0; }
.prob-box { background:var(--blue-bg); border-left:3px solid var(--blue); padding:11px 15px; border-radius:0 8px 8px 0; margin:8px 0; }
.sol-box { background:var(--green-bg); border-left:3px solid var(--green); padding:11px 15px; border-radius:0 8px 8px 0; margin:8px 0; }
.price-box { background:var(--accent-dim); border-left:3px solid var(--accent); padding:14px 18px; border-radius:0 10px 10px 0; margin:12px 0; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.price-box .big { font-size:26px; font-weight:900; color:var(--accent2); white-space:nowrap; }
.buy-btn { display:block; width:100%; padding:14px; border:none; border-radius:11px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:18px; box-shadow:0 4px 12px rgba(224,106,0,0.28); transition:filter .15s; }
.buy-btn:hover { filter:brightness(1.05); }
.buy-hint { text-align:center; font-size:11px; color:var(--text-muted); margin-top:9px; }
.steps { display:flex; flex-direction:column; gap:9px; }
.step { display:flex; gap:11px; align-items:flex-start; font-size:12px; color:var(--text-dim); }
.step .n { width:23px; height:23px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
/* 需求收集箱 */
.wishbox {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:22px; margin-top:18px; box-shadow:var(--shadow-sm);
  border-left:4px solid var(--accent);
}
.wish-head { margin-bottom:13px; }
.wish-title { font-size:16px; font-weight:800; }
.wish-sub { font-size:12px; color:var(--text-dim); margin-top:4px; }
.wishbox textarea {
  width:100%; min-height:82px; border:1.5px solid var(--border); border-radius:11px;
  padding:13px; font-size:13px; font-family:inherit; color:var(--text); resize:vertical;
  box-sizing:border-box;
}
.wishbox textarea:focus { outline:none; border-color:var(--accent); }
.wish-row { display:flex; align-items:center; gap:12px; margin-top:13px; }
.wish-btn {
  border:none; border-radius:11px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  font-size:14px; font-weight:700; padding:12px 24px; cursor:pointer; box-shadow:0 4px 12px rgba(224,106,0,0.28);
}
.wish-btn:hover { filter:brightness(1.05); }
.wish-count { font-size:11px; color:var(--text-muted); }
.wish-tip { font-size:11px; color:var(--text-muted); margin-top:9px; }
.wish-tip.ok { color:var(--green); font-weight:600; }
.wish-admin { margin-top:12px; background:var(--card); border:1px dashed var(--border); border-radius:10px; overflow:hidden; }
.wish-admin-head { font-size:12px; color:var(--text-muted); padding:10px 14px; cursor:pointer; }
.wish-admin-head:hover { background:#fafafa; }
.wish-list { display:none; padding:0 14px 12px; font-size:12px; }
.wish-list.show { display:block; }
.wish-item { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid #f3f4f6; }
.wish-item:last-child { border-bottom:none; }
.wish-item .w-text { color:var(--text); flex:1; line-height:1.5; }
.wish-item .w-del { color:var(--red); cursor:pointer; font-size:12px; flex-shrink:0; }
footer { text-align:center; font-size:11px; color:var(--text-muted); margin-top:32px; }
@media(max-width:760px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media(max-width:480px){ .grid{grid-template-columns:1fr} }
</style>
</head>

// ===== 价格展示格式化 =====
function fmtPrice(price) {
  if (price === '待定') return '待定';
  if (price === '0') return '0元';
  return '¥' + price;
}

// ===== 渲染筛选栏 =====
let currentCat = '全部';
const FILTER_ORDER = ['全部','陪跑服务','B端咨询','知识产品','实体产品','服务类','诊断服务'];
function renderFilter() {
  const bar = document.getElementById("filterBar");
  bar.innerHTML = FILTER_ORDER.map(c =>
    `<div class="fpill ${c === currentCat ? 'active' : ''}" onclick="setFilter('${c}')">${c}</div>`
  ).join("");
}
function setFilter(cat) {
  currentCat = cat;
  renderFilter();
  renderGrid();
}

// ===== 渲染产品网格 =====
function renderGrid() {
  const grid = document.getElementById("productGrid");
  const list = currentCat === '全部' ? PRODUCTS : PRODUCTS.filter(p => p.cat === currentCat);
  grid.innerHTML = list.map(p => {
    const st = CAT_STYLE[p.cat] || {bg:'#eee', grad:'#eee', fg:'#666', line:'#ccc'};
    return `
    <div class="product" onclick="openModal(${p.id})" style="--cat-color:${st.line}">
      <div class="p-icon" style="background:${st.grad}">${p.icon}</div>
      <div class="p-cat" style="color:${st.fg}">${p.cat}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-desc">${p.desc}</div>
      <div class="p-price">${fmtPrice(p.price)}<span class="unit"> ${p.unit}</span></div>
      <span class="p-badge ${p.badge}">${p.badgeTxt}</span>
    </div>`;
  }).join("");
  document.getElementById("heroCount").textContent = `共 ${PRODUCTS.length} 个产品 / 服务` + (currentCat === '全部' ? '' : ` · 当前显示「${currentCat}」${list.length}个`);
}

// ===== 弹窗 =====
function openModal(id) {
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  document.getElementById("modalTitle").textContent = `${p.icon} ${p.name}`;
  document.getElementById("modalBody").innerHTML = `
    <h4>❓ 解决什么问题</h4>
    <div class="prob-box">${p.problem}</div>
    <h4>✅ 怎么解决</h4>
    <div class="sol-box">${p.solution}</div>
    <h4>💰 价格说明</h4>
    <div class="price-box">
      <div>${p.priceDetail}</div>
      <div class="big">${fmtPrice(p.price)}</div>
    </div>
    <h4>📦 交付方式</h4>
    <div>${p.delivery}</div>
    <h4>🛒 购买流程</h4>
    <div class="steps">
      ${p.steps.map((s, i) => `<div class="step"><span class="n">${i+1}</span><span>${s}</span></div>`).join("")}
    </div>
    <button class="buy-btn" onclick="alert('当前为演示版：正式收款接入微信支付商户号后自动交付。现在购买请加安叔微信 NineHalf95 备注产品名。')">📩 立即购买 / 咨询</button>
    <div class="buy-hint">付款后微信自动交付内容/开通服务 · 实体产品快递发出</div>
  `;
  document.getElementById("modalOverlay").classList.add("active");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
  document.body.style.overflow = "";
}

// ===== 需求收集箱 =====
const WISH_KEY = "anshuWishes";
function loadWishes() {
  try { return JSON.parse(localStorage.getItem(WISH_KEY)) || []; } catch(e) { return []; }
}
function saveWishes(list) {
  try { localStorage.setItem(WISH_KEY, JSON.stringify(list)); } catch(e) {}
}
function renderWishCount() {
  const n = loadWishes().length;
  document.getElementById("wishCount").textContent = `已收集 ${n} 条需求`;
}
function renderWishList() {
  const list = loadWishes();
  const box = document.getElementById("wishList");
  if (!list.length) { box.innerHTML = '<div style="color:var(--text-muted);padding:6px 0">暂无需求，等客户来投</div>'; }
  else {
    box.innerHTML = list.map((w, i) => `
      <div class="wish-item">
        <span class="w-text">📮 ${w.text}</span>
        <span class="w-del" onclick="delWish(${i})">删除</span>
      </div>
    `).join("");
  }
}
function submitWish() {
  const input = document.getElementById("wishInput");
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  const list = loadWishes();
  list.push({ text: text, time: new Date().toLocaleString("zh-CN") });
  saveWishes(list);
  input.value = "";
  renderWishCount();
  renderWishList();
  const tip = document.querySelector(".wish-tip");
  tip.textContent = "✅ 需求已收到！安叔看到后会优先做出来，做出来第一时间通知你";
  tip.classList.add("ok");
  setTimeout(() => { alert("需求已记录 ✅\n\n想更快拿到，可以加安叔微信 NineHalf95，把需求直接发给我，备注「需求」"); }, 300);
}
function delWish(i) {
  const list = loadWishes();
  list.splice(i, 1);
  saveWishes(list);
  renderWishCount();
  renderWishList();
}
function toggleAdmin() {
  document.getElementById("wishList").classList.toggle("show");
  renderWishList();
}

renderFilter();
renderGrid();
renderWishCount();
</script>
