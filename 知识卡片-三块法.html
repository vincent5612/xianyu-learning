<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识卡片 · 三块法</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
  body { font-family: 'Noto Serif SC', serif; background: #e8e0d5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
</style>
</head>
<body>
<div style="max-width:440px; width:100%; background:#f5f0eb; border-radius:0; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.08);">

  <div style="background:#3c3a37; padding:28px 24px 20px; border-bottom:3px solid #b8a088;">
    <div style="font-size:11px; letter-spacing:2px; color:#8a8072; margin-bottom:8px;">METHOD <span style="color:#6a6052;">NO.009</span></div>
    <div style="font-weight:900; font-size:26px; line-height:1.2; color:#f0ebe4; margin-bottom:4px;">三块法</div>
    <div style="font-size:10px; letter-spacing:1px; color:#a09888; margin-top:4px;">理解→连接→落地</div>
  </div>

  <div style="padding:24px;">

    <div style="border-left:3px solid #b8a088; padding-left:14px; margin-bottom:16px;">
      <div style="font-weight:700; font-size:14px; color:#3c3a37; line-height:1.5;">每天55分钟，
把一个概念真正变成自己的</div>
    </div>

    <div style="background:#ede6dc; padding:14px; margin-bottom:16px; font-size:12px; color:#6a6052; line-height:1.6;">
      块一·理解（30min）：深挖核心，追问到能说清
块二·连接（15min）：找生活工作中的对应场景
块三·落地（10min）：压缩成卡片或短文发出去
    </div>

    <div style="background:rgba(184,160,136,0.08); padding:16px; margin-bottom:16px;">
      <div style="font-weight:700; font-size:13px; color:#3c3a37; margin-bottom:8px;">◆ 行动指南</div>
      <div style="font-size:12px; color:#7a7062; line-height:1.8;">
        No结合，No理解<br>找不到对应就承认没理解<br>宁可句子硬，不要滑过去
      </div>
    </div>

    <div style="font-style:italic; font-size:12px; color:#8a8072; text-align:center; padding:12px 0 4px; border-top:1px solid #e0d5c8;">
      "你不需要了解那么多知识，只需要少量有用的知识就能很好地生活"
    </div>

  </div>

  <div style="background:#ede6dc; padding:10px 24px; text-align:center; font-size:10px; color:#b0a898; letter-spacing:1px;">
    姜胡说 · 2026.05.11
  </div>

</div>
</body>
</html>
