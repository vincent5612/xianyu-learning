    <p style="margin:0;font-size:20px;font-weight:800;color:#0a0a0a;">过去几十年，我们拼命奖励「快」</p>
  </section>

  <p style="margin:0 0 14px;">年轻时我最信一句话：<span leaf="">趁年轻，多折腾</span>。那时候快就是一切——反应快、学得快、拼得起，一天顶别人三天，你就是人才。</p>
  <p style="margin:0 0 14px;">所以我一直觉得，过了三十五还不往上走，就完了。<span leaf="">这是这个社会教给我们的焦虑</span>。</p>
  <p style="margin:0 0 14px;">但这两年AI起来以后，我观察到一个变化：过去特别值钱的「快」，正在迅速变便宜。</p>
  <p style="margin:0 0 14px;">写代码，AI比你快；搜资料，AI比你快；做分析，AI比你快。它还不拿工资、不睡觉、不喊累。</p>

  <p style="margin:0 0 6px;">年轻人再聪明，也压缩不了时间的厚度。</p>

  <p style="margin:0 0 14px;">我做了14年电商和招聘，说几个我现在才看明白的判断。</p>
  <p style="margin:0 0 14px;">2024年我踩过不少坑，有个道理是亏出来的：<span leaf="" style="font-weight:700;color:#FF7D29;">止损线</span>。该退就退，别和烂项目谈感情。这个判断，二十多岁的我做不出来——那时候总觉得坚持就是胜利。</p>
  <p style="margin:0 0 14px;">还有一个是成本倒算。我看项目不看价格，看代价。价格是明账，时间成本、试错成本、机会成本是暗账。这几个账，没有十几年生意做底子，你根本算不明白。</p>
  <p style="margin:0 0 14px;">还有选项目。年轻人选项目看风口，我选项目看两样：<span leaf="">启动成本多高、亏了扛不扛得住</span>。风口人人看得到，扛不扛得住，只有踩过坑的人算得出来。</p>
  <p style="margin:0 0 14px;">现在AI来了，它把我这些判断进一步放大：我知道该问什么，它去找答案；我知道该看什么，它去做分析；方向定好了，它推着我往前跑。</p>
  <p style="margin:0 0 6px;">以前我焦虑：我还能不能学得过年轻人？</p>

  <p style="margin:0 0 14px;">Y Combinator的总裁Gary Tan提过一个判断：下一代独角兽创始人，会出现越来越多四五十岁、有品位、有判断力的人。因为有了AI Agent，一个人背后随时可以站着几十个几百个数字员工替他干活。</p>
  <p style="margin:0 0 14px;">我越来越觉得，这一轮AI，<span leaf="">四五十岁的管理者真的赶上了一波红利</span>。</p>
  <p style="margin:0 0 14px;">但我要泼一盆冷水：这个红利不是自动到账的。</p>
  <p style="margin:0 0 14px;">经验值钱，是有前提的——你得真的见过周期、踩过坑、做过复盘。你要是干二十年都只是把一件事重复了二十遍，那你的经验只是岁数，不是资产。</p>
  <p style="margin:0 0 6px;">所以我一直逼自己干一件事：把经验变成体系。踩过的坑写成方法论，做过的判断沉淀成弹药，让AI帮我把这些整理成可复制、可传递的东西。</p>

async function copyContent() {
  const btn = document.getElementById('copyBtn');
  try {
    const blob = new Blob([BODY_HTML], { type: 'text/html' });
    const data = [new ClipboardItem({ 'text/html': blob })];
    await navigator.clipboard.write(data);
    btn.textContent = '✅ 已复制，去公众号粘贴！';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 复制到公众号'; btn.classList.remove('copied'); }, 3000);
  } catch (err) {
    const div = document.createElement('div');
    div.innerHTML = BODY_HTML;
    div.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(div);
    const range = document.createRange();
    range.selectNodeContents(div);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    document.body.removeChild(div);
    btn.textContent = '✅ 已复制（降级模式）';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 复制到公众号'; btn.classList.remove('copied'); }, 3000);
  }
}
