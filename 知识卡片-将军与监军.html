<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识卡片 · 将军与监军</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
  body { font-family: 'Noto Serif SC', serif; background: #e8e0d5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
</style>
</head>
<body>
<div style="max-width:440px; width:100%; background:#f5f0eb; border-radius:0; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.08);">

  <!-- Header -->
  <div style="background:#3c3a37; padding:28px 24px 20px; border-bottom:3px solid #b8a088;">
    <div style="font-size:11px; letter-spacing:2px; color:#8a8072; margin-bottom:8px;">STRATEGY <span style="color:#6a6052;">NO.002</span></div>
    <div style="font-weight:900; font-size:28px; line-height:1.2; color:#f0ebe4; margin-bottom:4px;">将军与监军</div>
    <div style="font-size:11px; letter-spacing:2px; color:#a09888; margin-top:4px;">FIND YOUR MONITOR, DON'T BE ONE</div>
  </div>

  <!-- Body -->
  <div style="padding:24px;">

    <!-- 认知组：摘要 -->
    <div style="border-left:3px solid #b8a088; padding-left:14px; margin-bottom:16px;">
      <div style="font-weight:700; font-size:15px; color:#3c3a37; line-height:1.5;">
        将军不需要自己当监军<br>但将军必须找对人当监军
      </div>
    </div>

    <!-- 对比区 -->
    <div style="margin-bottom:16px;">

      <!-- 将军 -->
      <div style="background:#ede6dc; padding:14px; margin-bottom:8px; border-left:3px solid #b8a088;">
        <div style="font-weight:700; font-size:13px; color:#3c3a37; margin-bottom:6px;">⚔ 将军（安叔）</div>
        <div style="font-size:12px; color:#7a7062; line-height:1.7;">
          定方向 · 搭流程 · 培训人<br>
          对外对接 · 对内赋能<br>
          看大图，不做颗粒度管理
        </div>
      </div>

      <!-- 监军 -->
      <div style="background:#ede6dc; padding:14px; border-left:3px solid #8a8072;">
        <div style="font-weight:700; font-size:13px; color:#3c3a37; margin-bottom:6px;">🔍 监军（搭档）</div>
        <div style="font-size:12px; color:#7a7062; line-height:1.7;">
          天然细心，甚至有点强迫症<br>
          不怕得罪人，敢催、敢盯、敢追<br>
          不追求做决策，甘愿做执行<br>
          忠诚度高，认同你的方向
        </div>
      </div>

    </div>

    <!-- 执行组 -->
    <div style="background:rgba(184,160,136,0.08); padding:16px; margin-bottom:16px;">
      <div style="font-weight:700; font-size:13px; color:#3c3a37; margin-bottom:10px;">◆ 组建原则</div>
      <div style="font-size:12px; color:#7a7062; line-height:1.8;">
        ① 战略层：你（强）<br>
        ② 架构层：你（强）<br>
        ③ 执行层：缺搭档（招）<br>
        → 第一优先级：找对监军
      </div>
    </div>

    <!-- 金句 -->
    <div style="font-style:italic; font-size:12px; color:#8a8072; text-align:center; padding:12px 0 4px; border-top:1px solid #e0d5c8;">
      "将军不需要自己当监军，但将军必须找对人当监军<br>这是你组建任何团队的第一优先级"
    </div>

  </div>

  <!-- Footer -->
  <div style="background:#ede6dc; padding:10px 24px; text-align:center; font-size:10px; color:#b0a898; letter-spacing:1px;">
    BY 安叔 · 个人方法论
  </div>

</div>
</body>
</html>
