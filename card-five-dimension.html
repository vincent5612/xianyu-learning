<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五维系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0F1E;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:16px}
.kcard{width:420px;background:linear-gradient(180deg,#121A29 0%,#0D1321 100%);border-radius:20px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,0.4),0 0 60px rgba(76,201,240,0.05)}
.kcard-header{padding:22px 24px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.04)}
.header-tag{font-size:10px;color:#F59E0B;letter-spacing:2px;display:flex;align-items:center;gap:6px;font-weight:600}
.header-dot{width:5px;height:5px;border-radius:50%;background:#F59E0B}
.header-num{font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:1px}
.kcard-hero{padding:20px 24px 14px}
.hero-label{font-size:10px;color:#F59E0B;letter-spacing:2px;margin-bottom:6px;display:flex;align-items:center;gap:5px;font-weight:600}
.hero-bar{width:18px;height:2px;background:#F59E0B;border-radius:1px}
.hero-title{font-size:24px;font-weight:900;color:#FFFFFF;line-height:1.3;letter-spacing:-0.3px}
.hero-title .hl{color:#F59E0B}
.hero-sub{font-size:12px;color:rgba(255,255,255,0.45);margin-top:5px;line-height:1.6}
.item-wrap{padding:4px 24px 12px}
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04);align-items:flex-start}
.item:last-child{border-bottom:none}
.item-icon{width:32px;height:32px;min-width:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px;background:rgba(245,158,11,0.15);color:#F59E0B;font-weight:700}
.item-body{flex:1}
.item-top{margin-bottom:3px}
.item-num{font-size:13px;font-weight:700;color:#F59E0B}
.item-desc{font-size:11px;color:rgba(255,255,255,0.55);line-height:1.6}
.kcard-footer{background:rgba(255,255,255,0.03);padding:12px 24px 10px;border-top:1px solid rgba(255,255,255,0.04);display:flex;align-items:flex-start;gap:8px}
.footer-icon{font-size:13px;color:#F59E0B;flex-shrink:0;margin-top:1px}
.footer-text{font-size:11px;color:rgba(255,255,255,0.5);line-height:1.6}
.footer-text strong{color:#F59E0B}
.kcard-brand{padding:10px 24px 14px;display:flex;justify-content:space-between;align-items:center}
.brand-left{font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:1px}
.brand-right{font-size:9px;color:rgba(255,255,255,0.15)}
</style>
</head>
<body>
<div class="kcard">
  <div class="kcard-header">
    <span class="header-tag"><span class="header-dot"></span> 知识卡</span>
    <span class="header-num">NO.027</span>
  </div>
  <div class="kcard-hero">
    <div class="hero-label"><span class="hero-bar"></span> 知识卡</div>
    <div class="hero-title"><span class="hl">五维系统</span></div>
    <div class="hero-sub">有效自学-正确做事<br>-持续升值</div>
  </div>
  <div class="item-wrap">
    <div class="item">
      <div class="item-icon">❶</div>
      <div class="item-body">
        <div class="item-top"><span class="item-num">有效自学</span></div>
        <div class="item-desc">不是学得多，是学得对</div>
        <div class="item-desc">用三块法学，用门禁四问筛</div>
        <div class="item-desc">输入质量决定输出质量</div>
      </div>
    </div>    <div class="item">
      <div class="item-icon">❷</div>
      <div class="item-body">
        <div class="item-top"><span class="item-num">正确做事</span></div>
        <div class="item-desc">用乘法思维判断投入产出</div>
        <div class="item-desc">用止损线控制风险</div>
        <div class="item-desc">方向对了，努力才有意义</div>
      </div>
    </div>    <div class="item">
      <div class="item-icon">❸</div>
      <div class="item-body">
        <div class="item-top"><span class="item-num">持续升值</span></div>
        <div class="item-desc">复利效应在时间中显现</div>
        <div class="item-desc">长期做的事，时间会给你答案</div>
        <div class="item-desc">五维是一套操作系统不是知识清单</div>
      </div>
    </div>
  </div>
  <div class="kcard-footer">
    <span class="footer-icon">⚡</span>
    <div class="footer-text"><strong>洞见：</strong>有效自学-正确做事-持续升值。五维是一套操作系统，不是知识清单。</div>
  </div>
  <div class="kcard-brand">
    <span class="brand-left">安叔 · 副业实验室</span>
    <span class="brand-right">NO.027</span>
  </div>
</div>
</body>
</html>
