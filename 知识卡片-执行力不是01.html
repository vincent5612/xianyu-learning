<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识卡片 · 执行力</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
  body { font-family: 'Noto Serif SC', serif; background: #e8e0d5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
</style>
</head>
<body>
<div style="max-width:420px; width:100%; background:#f5f0eb; border-radius:0; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.08);">

  <!-- Header -->
  <div style="background:#3c3a37; padding:28px 24px 20px; border-bottom:3px solid #b8a088;">
    <div style="font-size:11px; letter-spacing:2px; color:#8a8072; margin-bottom:8px;">STRATEGY <span style="color:#6a6052;">NO.001</span></div>
    <div style="font-weight:900; font-size:28px; line-height:1.2; color:#f0ebe4; margin-bottom:4px;">执行力不是0/1</div>
    <div style="font-size:11px; letter-spacing:2px; color:#a09888; margin-top:4px;">IT'S A 3-10 PROBLEM</div>
  </div>

  <!-- Body -->
  <div style="padding:24px;">

    <!-- 认知组：摘要 -->
    <div style="border-left:3px solid #b8a088; padding-left:14px; margin-bottom:16px;">
      <div style="font-weight:700; font-size:15px; color:#3c3a37; line-height:1.5;">
        执行力不是"做不做"的判断题<br>是"做到什么程度"的程度题
      </div>
    </div>

    <!-- 机制区 -->
    <div style="background:#ede6dc; padding:14px; margin-bottom:20px; font-size:12px; color:#6a6052; line-height:1.6;">
      旧版公式：学习力 × 开店数 × 执行力 → "缺一归零"<br>
      新版修正：学习力 × 开店数 × 执行力值(3-10)<br>
      → 执行力永远不会是0, 是3到10之间的大小问题
    </div>

    <!-- 执行组 -->
    <div style="background:rgba(184,160,136,0.08); padding:16px; margin-bottom:16px;">
      <div style="font-weight:700; font-size:13px; color:#3c3a37; margin-bottom:10px;">◆ 场景转化</div>
      <div style="font-size:12px; color:#7a7062; line-height:1.8;">
        ① 旧对策：他不执行 → 淘汰<br>
        ② 新对策：执行力值3 → 群内反复提醒调到5<br>
        ③ 核心转变：不要用判断题管理，用程度题推进
      </div>
    </div>

    <!-- 金句 -->
    <div style="font-style:italic; font-size:12px; color:#8a8072; text-align:center; padding:12px 0 4px; border-top:1px solid #e0d5c8;">
      "用判断题筛选人，用程度题管理事"
    </div>

  </div>

  <!-- Footer -->
  <div style="background:#ede6dc; padding:10px 24px; text-align:center; font-size:10px; color:#b0a898; letter-spacing:1px;">
    BY 安叔 · 三块法练习 2026.06.13
  </div>

</div>
</body>
</html>
