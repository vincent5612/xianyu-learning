<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆 · 知识库</title>
<style>
:root[data-theme="dark"]{
  --bg:#0d0e12;--panel:#14161d;--card:#191c25;--card-hi:#20242f;--line:rgba(255,255,255,.075);
  --line-hi:rgba(255,255,255,.15);--tx:#eef1f7;--tx2:#98a3b8;--tx3:#69758c;
  --accent:#4a7dff;--accent-2:#7c5cff;--accent-soft:rgba(74,125,255,.15);
  --ok:#2ed573;--warn:#f0a500;--danger:#ff4757;--shadow:0 10px 34px rgba(0,0,0,.42);--mark:rgba(240,165,0,.26);
}
:root[data-theme="light"]{
  --bg:#f2f4f9;--panel:#fff;--card:#fff;--card-hi:#f6f8fc;--line:#e4e9f2;--line-hi:#cdd7e6;
  --tx:#161d2b;--tx2:#56637a;--tx3:#8b98ae;--accent:#2f6bff;--accent-2:#7c5cff;--accent-soft:rgba(47,107,255,.09);
  --ok:#0eab6f;--warn:#c98200;--danger:#e5484d;--shadow:0 6px 22px rgba(20,40,80,.07);--mark:rgba(240,165,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;
  background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh}
.sb{width:240px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .lg{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center}
.brand .lg svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:14.5px;font-weight:650}
.brand p{font-size:10.5px;color:var(--tx3);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.nav button{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;border:none;background:none;
  color:var(--tx2);font-size:13px;font-family:inherit;cursor:pointer;text-align:left;transition:.15s;width:100%}
.nav button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--card-hi);color:var(--tx)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.slabel{font-size:10.5px;color:var(--tx3);letter-spacing:.6px;padding:0 11px 7px;font-weight:600}
.doms{flex:1;overflow-y:auto;margin:0 -4px}
.doms::-webkit-scrollbar{width:5px}.doms::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:3px}
.dom{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--tx2);cursor:pointer;transition:.14s}
.dom:hover{background:var(--card-hi);color:var(--tx)}
.dom.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dom i{width:6px;height:6px;border-radius:50%;flex:none}
.dom .cn{margin-left:auto;font-size:10px;color:var(--tx3)}
.sfoot{border-top:1px solid var(--line);padding:11px 10px 2px;font-size:10.5px;color:var(--tx3);line-height:1.7}
.sfoot b{color:var(--tx2)}
.main{flex:1;overflow-y:auto;padding:22px 26px 48px}
.main::-webkit-scrollbar{width:9px}.main::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:5px}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.mhead h2{font-size:17px;font-weight:650}
.mhead p{font-size:11.5px;color:var(--tx3)}
.spacer{flex:1}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);transition:.16s}
.ibtn:hover{border-color:var(--line-hi);color:var(--tx)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.view{display:none}.view.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.kpi{padding:15px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:.18s}
.kpi:hover{border-color:var(--line-hi);transform:translateY(-1px)}
.kpi .lb{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:5px}
.kpi .lb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.kpi .vl{font-size:26px;font-weight:650;margin-top:8px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:10.5px;color:var(--tx3);margin-top:4px}
.alert{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:13px;
  background:rgba(240,165,0,.09);border:1px solid rgba(240,165,0,.28);margin-bottom:18px}
.alert svg{width:16px;height:16px;stroke:var(--warn);fill:none;stroke-width:1.8;flex:none;margin-top:1px}
.alert p{font-size:12.5px;color:var(--tx2);line-height:1.65}
.alert b{color:var(--warn)}
.sec-h{display:flex;align-items:center;gap:8px;margin:22px 0 12px}
.sec-h h3{font-size:13.5px;font-weight:620}
.sec-h span{font-size:11px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dc{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.2s}
.dc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.dc .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px}
.dc .nm{font-size:14px;font-weight:620}
.dc .ct{font-size:10.5px;color:var(--tx3)}
.dc .ds{font-size:10.5px;color:var(--tx3);margin-bottom:11px;min-height:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 9px;margin-bottom:10px}
.st{font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:5px}
.st b{color:var(--tx);font-weight:600}
.st svg{width:11px;height:11px;stroke:var(--tx3);fill:none;stroke-width:1.8;flex:none}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.foot{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--tx3)}
.pill{padding:2px 7px;border-radius:20px;font-size:9.5px;font-weight:600}
.pill.ok{background:rgba(46,213,115,.14);color:var(--ok)}
.pill.warn{background:rgba(240,165,0,.15);color:var(--warn)}
.pill.bad{background:rgba(255,71,87,.15);color:var(--danger)}
.pill.na{background:var(--card-hi);color:var(--tx3)}
.tl{display:flex;align-items:stretch;gap:7px;height:130px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.tl .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tl .num{font-size:10.5px;color:var(--tx2)}
.tl .track{flex:1;width:100%;display:flex;align-items:flex-end;min-height:0}
.tl .bx{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent),rgba(74,125,255,.28));min-height:4px;transition:.25s}
.tl .col:hover .bx{filter:brightness(1.3)}
.tl .lb{font-size:9.5px;color:var(--tx3)}
.sbar{display:flex;gap:10px;margin-bottom:12px}
.sinput{flex:1;display:flex;align-items:center;gap:9px;padding:13px 16px;border-radius:13px;background:var(--card);border:1px solid var(--line);transition:.18s}
.sinput:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sinput svg{width:16px;height:16px;stroke:var(--tx3);fill:none;stroke-width:1.9;flex:none}
.sinput input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:14px;font-family:inherit}
.sinput input::placeholder{color:var(--tx3)}
.btn{padding:13px 26px;border-radius:13px;border:none;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.18s}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.45;cursor:default}
.hits{display:flex;flex-direction:column;gap:10px}
.hit{padding:14px 16px;border-radius:13px;background:var(--card);border:1px solid var(--line);transition:.16s}
.hit:hover{border-color:var(--line-hi)}
.hit .hh{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.hit .hn{font-size:13px;font-weight:620}
.hit .hp{font-size:10px;color:var(--tx3);margin-left:auto}
.hit .sn{font-size:12.5px;color:var(--tx2);line-height:1.78}
.hit mark{background:var(--mark);color:var(--tx);padding:0 2px;border-radius:3px}
.tag{padding:2px 8px;border-radius:6px;font-size:9.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.chat{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.msg{display:flex;gap:11px;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.msg.ai .av{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.msg.me .av{background:var(--card-hi);border:1px solid var(--line)}
.av svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.msg.me .av svg{stroke:var(--tx2)}
.bub{padding:13px 16px;border-radius:14px;font-size:13.5px;line-height:1.8;white-space:pre-wrap}
.msg.ai .bub{background:var(--card);border:1px solid var(--line)}
.msg.me .bub{background:var(--accent);color:#fff}
.srcwrap{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.srclb{font-size:10.5px;color:var(--tx3);font-weight:600;margin-bottom:7px}
.src{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;background:var(--card-hi);margin-bottom:5px;font-size:11px;color:var(--tx2)}
.src .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .sc{margin-left:auto;color:var(--tx3);font-size:10px;flex:none}
.askwrap{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 34%);padding:14px 0 4px}
.askbox{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;border-radius:15px;background:var(--card);border:1px solid var(--line);transition:.18s}
.askbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.askbox textarea{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:14px;font-family:inherit;resize:none;height:44px;line-height:1.6}
.askbox textarea::placeholder{color:var(--tx3)}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sug span{padding:6px 13px;border-radius:20px;font-size:11.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s}
.sug span:hover{border-color:var(--accent);color:var(--accent)}
.loading{display:inline-flex;gap:4px;align-items:center}
.loading i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite}
.loading i:nth-child(2){animation-delay:.2s}.loading i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.empty{padding:44px;text-align:center;color:var(--tx3);font-size:12.5px;line-height:2}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .sb{width:64px;padding:14px 8px}
  .brand .txt,.nav button span,.slabel,.doms,.sfoot{display:none}
  .brand{justify-content:center;padding:4px 0 14px}
  .nav button{justify-content:center;padding:11px 0}
  .main{padding:16px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){.grid{grid-template-columns:1fr}.msg{max-width:100%}}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="brand">
      <div class="lg"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div>
      <div class="txt"><h1>记忆 · 知识库</h1><p>智脑工作台</p></div>
    </div>
    <nav class="nav">
      <button class="on" data-v="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>总览看板</span></button>
      <button data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>全文检索</span></button>
      <button data-v="ask"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-8 8H8l-5 3 1.5-5A8 8 0 1121 12z"/></svg><span>AI 询问</span></button>
    </nav>
    <div class="slabel">知识域</div>
    <div class="doms" id="doms"></div>
    <div class="sfoot" id="sfoot">加载中…</div>
  </aside>

  <main class="main">
    <div class="view on" id="v-dash">
      <div class="mhead">
        <div><h2>总览看板</h2><p id="genTime">—</p></div>
        <div class="spacer"></div>
        <button class="ibtn themeBtn" title="切换深浅主题"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      </div>
      <div class="alert" id="alertBox"></div>
      <div class="kpis" id="kpis"></div>
      <div class="sec-h"><h3>知识域</h3><span>点卡片 → 直接进入该域检索</span></div>
      <div class="grid" id="grid"></div>
      <div class="sec-h"><h3>产出节奏</h3><span id="tlHint"></span></div>
      <div class="tl" id="tl"></div>
    </div>

    <div class="view" id="v-search">
      <div class="mhead"><div><h2>全文检索</h2><p id="sMeta">查的是正文内容，不是文件名</p></div>
        <div class="spacer"></div>
        <button class="ibtn themeBtn" title="切换深浅主题"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      </div>
      <div class="sbar">
        <div class="sinput">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" placeholder="输入关键词，检索全库正文…（如：招商话术 / 密级 / RPO 结算）">
        </div>
        <button class="btn" id="goSearch">检索</button>
      </div>
      <div class="sug" id="sug"></div>
      <div class="hits" id="hits"><div class="empty">输入关键词开始检索<br>例：招商话术、密级、学员案例、RPO 结算</div></div>
    </div>

    <div class="view" id="v-ask">
      <div class="mhead"><div><h2>AI 询问</h2><p>先检索资料 → 模型只依据你的知识回答 → 附引用来源，没有就说没有</p></div>
        <div class="spacer"></div>
        <button class="ibtn themeBtn" title="切换深浅主题"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      </div>
      <div class="chat" id="chat"></div>
      <div class="sug" id="sug2"></div>
      <div class="askwrap">
        <div class="askbox">
          <textarea id="aq" placeholder="问知识库里的任何事…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="btn" id="goAsk">发送</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nfmt = n => n>=100000000 ? (n/100000000).toFixed(2)+'亿' : n>=10000 ? (n/10000).toFixed(1)+'万' : (n||0).toLocaleString('zh-CN');
const sz = b => b>=1048576 ? (b/1048576).toFixed(1)+'MB' : b>=1024 ? (b/1024).toFixed(0)+'KB' : (b||0)+'B';
const dt = t => { if(!t) return '—'; const d=new Date(t*1000); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const ico = n => { const m={files:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',chars:'<path d="M4 6h16M4 12h10M4 18h7"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-4 4 3 3-2 4 3"/>',doc:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5z"/><path d="M14 3v5h5"/>',media:'<rect x="2" y="5" width="14" height="14" rx="2"/><path d="M16 10l6-3v10l-6-3z"/>',disk:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'}; return `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">${m[n]||''}</svg>`; };
const DOT = {ok:'var(--ok)',warn:'var(--warn)',bad:'var(--danger)',na:'var(--tx3)'};

const root = document.documentElement;
const qp = new URLSearchParams(location.search).get('theme');
if(qp) root.dataset.theme = qp; else { const s = localStorage.getItem('kb-theme'); if(s) root.dataset.theme = s; }
document.querySelectorAll('.themeBtn').forEach(b => b.onclick = () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('kb-theme', root.dataset.theme);
});

function go(v){
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('on'));
  $('#v-' + v).classList.add('on');
  if(v === 'ask' && !$('#chat').children.length) greet();
}
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => go(b.dataset.v));

let DASH = null, curDom = null;
fetch('/api/dash').then(r => r.json()).then(d => { DASH = d; renderDash(); });

function rateCls(d){ const tr = d.readable + d.evicted; if(!tr) return ['无文本文件','na'];
  const r = d.readable / tr; if(r >= .95) return [Math.round(r*100)+'% 可读','ok'];
  if(r >= .3) return [Math.round(r*100)+'% 可读','warn']; return [r === 0 ? '未落地' : Math.round(r*100)+'% 可读','bad']; }

function renderDash(){
  const T = DASH.total;
  $('#genTime').textContent = `数据 ${DASH.generated_at} · 全量扫描 · 只读`;
  $('#alertBox').innerHTML = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
    <p><b>${T.evicted} 篇内容本机读不到内容（iCloud 仅存占位符）</b>，集中在 Obsidian 主库。看板与检索都如实反映：这些笔记<b>现在任何本地检索 / AI 索引都取不到</b>。</p>`;
  $('#kpis').innerHTML = [
    ['files','文件总数',nfmt(T.files),`${T.domains} 个知识域`],
    ['chars','知识文本',nfmt(DASH.knowledge_chars),'md / txt 字符'],
    ['img','图片',nfmt(T.images),'截图 · 卡片 · 海报'],
    ['doc','文档',nfmt(T.docs),'Word · Excel · PPT · PDF'],
    ['media','影音',nfmt(T.media),'口播 · 视频 · 录音'],
    ['disk','占用体积',sz(T.size),'本机已落地部分'],
  ].map(([i,l,v,s]) => `<div class="kpi"><div class="lb">${ico(i)}${l}</div><div class="vl">${v}</div><div class="sub">${s}</div></div>`).join('');

  const mx = Math.max(...DASH.domains.map(d => d.files));
  $('#grid').innerHTML = DASH.domains.map((d,i) => { const [txt,cls] = rateCls(d); return `
    <div class="dc" data-i="${i}">
      <div class="hd"><div class="nm">${d.name}</div><div class="ct">${nfmt(d.files)} 个文件</div></div>
      <div class="ds">${d.desc}</div>
      <div class="stats">
        <div class="st">${ico('chars')}知识文本 <b>${d.chars?nfmt(d.chars):'—'}</b></div>
        <div class="st">${ico('img')}图片 <b>${d.images}</b></div>
        <div class="st">${ico('doc')}文档 <b>${d.docs}</b></div>
        <div class="st">${ico('media')}影音 <b>${d.media}</b></div>
      </div>
      <div class="bar"><i style="width:${Math.max(3,d.files/mx*100)}%"></i></div>
      <div class="foot"><span>最近 ${dt(d.last)}</span><span class="pill ${cls}">${txt}</span></div>
    </div>`; }).join('');
  $('#grid').onclick = e => { const c = e.target.closest('.dc'); if(!c) return;
    curDom = DASH.domains[+c.dataset.i].name; renderDoms(); go('search'); $('#q').focus(); };

  const ms = Object.entries(DASH.months), m2 = Math.max(...ms.map(x => x[1]));
  $('#tlHint').textContent = `近 ${ms.length} 个月，全库文件增量`;
  $('#tl').innerHTML = ms.map(([m,c]) => `<div class="col" title="${m} · ${c} 个文件"><div class="num">${c}</div><div class="track"><div class="bx" style="height:${Math.max(4,c/m2*100)}%"></div></div><div class="lb">${m.slice(5)}月</div></div>`).join('');

  renderDoms();
  fetch('/api/stats').then(r => r.json()).then(s => {
    $('#sfoot').innerHTML = `索引 <b>${s.chunks}</b> 块 · 词项 <b>${nfmt(s.terms)}</b><br>构建于 ${s.built_at.slice(5,16)}`;
  });
  $('#sug').innerHTML = ['招商话术','学员案例','密级','RPO 结算','公司方针'].map(t => `<span data-q="${t}">${t}</span>`).join('');
  $('#sug2').innerHTML = ['京东店群招商现在跑通了吗？','公司方针是哪八个字？','RPO 是什么？'].map(t => `<span data-q="${t}">${t}</span>`).join('');
}

function renderDoms(){
  if(!DASH) return;
  $('#doms').innerHTML = `<div class="dom ${curDom?'':'on'}" data-d=""><i style="background:var(--accent)"></i>全部</div>` +
    DASH.domains.map(d => { const [,cls] = rateCls(d); return `<div class="dom ${curDom===d.name?'on':''}" data-d="${d.name}"><i style="background:${DOT[cls]}"></i>${d.name}<span class="cn">${d.files}</span></div>`; }).join('');
  $('#doms').onclick = e => { const x = e.target.closest('.dom'); if(!x) return;
    curDom = x.dataset.d || null; renderDoms();
    if($('#v-search').classList.contains('on') && $('#q').value.trim()) doSearch(); };
}

function hl(t, terms){ let o = esc(t);
  (terms||[]).filter(x => x.length >= 2).slice(0,12).forEach(x => {
    o = o.replace(new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<mark>${m}</mark>`); });
  return o; }

$('#sug').onclick = e => { const s = e.target.closest('span[data-q]'); if(!s) return; $('#q').value = s.dataset.q; doSearch(); };
$('#sug2').onclick = e => { const s = e.target.closest('span[data-q]'); if(!s) return; $('#aq').value = s.dataset.q; ask(); };

function doSearch(){
  const q = $('#q').value.trim();
  if(!q){ $('#hits').innerHTML = '<div class="empty">输入关键词开始检索<br>例：招商话术、密级、学员案例、RPO 结算</div>'; $('#sMeta').textContent = '查的是正文内容，不是文件名'; return; }
  $('#hits').innerHTML = '<div class="empty"><span class="loading"><i></i><i></i><i></i></span> 检索中…</div>';
  fetch(`/api/search?q=${encodeURIComponent(q)}&k=20` + (curDom ? `&dom=${encodeURIComponent(curDom)}` : ''))
    .then(r => r.json()).then(d => {
      $('#sMeta').textContent = `「${d.q}」${curDom ? ' ／ ' + curDom : ''} 命中 ${d.hits.length} 段正文`;
      if(!d.hits.length){ $('#hits').innerHTML = '<div class="empty">没有命中。换个词试试，或点左侧「全部」去掉域过滤。</div>'; return; }
      $('#hits').innerHTML = d.hits.map(h => `
        <div class="hit"><div class="hh"><span class="tag">${h.dom}</span><span class="hn">${esc(h.name)}</span>
          <span class="hp">相关度 ${h.score} · 第 ${h.chunk+1} 段</span></div>
          <div class="sn">${hl(h.snippet, (h.terms||[]).concat([d.q]))}</div>
          <div class="hp" style="font-size:10px;margin-top:7px">${esc(h.path)}</div></div>`).join('');
    });
}
$('#goSearch').onclick = doSearch;
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });

function greet(){
  $('#chat').innerHTML = `<div class="msg ai"><div class="av"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div>
    <div class="bub">我只依据你的知识库回答——答不出会说答不出，并附引用来源。现在全库索引 2,119 段正文。试着问点什么。</div></div>`;
}
function ask(){
  const q = $('#aq').value.trim(); if(!q) return;
  const btn = $('#goAsk'); btn.disabled = true; $('#aq').value = '';
  $('#chat').insertAdjacentHTML('beforeend', `<div class="msg me"><div class="av"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="bub">${esc(q)}</div></div>`);
  const id = 'ld' + Date.now();
  $('#chat').insertAdjacentHTML('beforeend', `<div class="msg ai" id="${id}"><div class="av"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div><div class="bub"><span class="loading"><i></i><i></i><i></i></span> 正在检索资料并回答…</div></div>`);
  const sc = $('.main'); sc.scrollTop = sc.scrollHeight;
  fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({q})})
    .then(r => r.json()).then(d => {
      const el = document.getElementById(id);
      el.querySelector('.bub').innerHTML = esc(d.answer) +
        (d.sources.length ? `<div class="srcwrap"><div class="srclb">引用来源 ${d.sources.length} 处</div>` +
          d.sources.map(s => `<div class="src"><span class="tag">${s.dom}</span><span class="nm">${esc(s.name)}</span><span class="sc">${s.score}</span></div>`).join('') + '</div>' : '');
      sc.scrollTop = sc.scrollHeight; btn.disabled = false;
    }).catch(e => { document.getElementById(id).querySelector('.bub').textContent = '请求失败：' + e; btn.disabled = false; });
}
$('#goAsk').onclick = ask;
$('#aq').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); } });
</script>
</body>
</html>
