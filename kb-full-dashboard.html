<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆 · 全量知识库看板</title>
<style>
:root[data-theme="dark"]{
  --bg:#0f0f13; --bg-grad1:#1a1a2e; --bg-grad2:#16213e;
  --card:rgba(26,26,46,.62); --card-hi:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.08); --line-hi:rgba(255,255,255,.16);
  --tx:#eef1f7; --tx2:#9aa7bd; --tx3:#6b7fa3;
  --accent:#4a7dff; --accent-soft:rgba(74,125,255,.16);
  --ok:#2ed573; --warn:#f0a500; --danger:#ff4757; --info:#6b9aff;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#f4f6fa; --bg-grad1:#ffffff; --bg-grad2:#eef2f9;
  --card:#ffffff; --card-hi:#f7f9fc;
  --line:#e3e8f0; --line-hi:#cfd8e6;
  --tx:#1a2233; --tx2:#5a6a86; --tx3:#8b98ae;
  --accent:#2f6bff; --accent-soft:rgba(47,107,255,.10);
  --ok:#10b981; --warn:#d98700; --danger:#e5484d; --info:#3b82f6;
  --shadow:0 4px 20px rgba(20,40,80,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;
  background:var(--bg); color:var(--tx); min-height:100vh; padding:20px 24px 60px;
  transition:background .25s,color .25s; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto}
/* ── 顶栏 ── */
.top{display:flex;align-items:center;gap:14px;padding:6px 0 20px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent),#7c5cff);
  display:flex;align-items:center;justify-content:center}
.logo svg{width:20px;height:20px;stroke:#fff}
.titles h1{font-size:19px;font-weight:650;letter-spacing:.2px}
.titles p{font-size:12px;color:var(--tx3);margin-top:3px}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card-hi);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.18s;color:var(--tx2)}
.iconbtn:hover{border-color:var(--line-hi);color:var(--tx);transform:translateY(-1px)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
/* ── 警示条 ── */
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:13px;
  background:rgba(240,165,0,.10);border:1px solid rgba(240,165,0,.30);margin-bottom:18px}
.alert svg{width:17px;height:17px;stroke:var(--warn);fill:none;stroke-width:1.8;flex:none;margin-top:1px}
.alert b{color:var(--warn)}
.alert p{font-size:12.5px;color:var(--tx2);line-height:1.65}
/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:20px}
@media(max-width:960px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 15px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 100% 0%,var(--accent-soft),transparent 70%);pointer-events:none}
.kpi .lb{font-size:11px;color:var(--tx3);letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .lb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.kpi .vl{font-size:25px;font-weight:640;margin-top:7px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .vl small{font-size:12px;font-weight:500;color:var(--tx2);margin-left:3px}
.kpi .sub{font-size:10.5px;color:var(--tx3);margin-top:4px}
/* ── 区块 ── */
.sec{margin-bottom:20px}
.sec-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sec-h svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.8}
.sec-h h2{font-size:14px;font-weight:600;letter-spacing:.2px}
.sec-h span{font-size:11.5px;color:var(--tx3)}
/* ── 域卡片 ── */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1080px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:470px){.grid{grid-template-columns:1fr}}
.dc{padding:15px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  cursor:pointer;transition:.2s;position:relative}
.dc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.dc .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px}
.dc .nm{font-size:14.5px;font-weight:600}
.dc .ct{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.dc .ds{font-size:11px;color:var(--tx3);margin-bottom:12px;min-height:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-bottom:11px}
.st{font-size:11.5px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.st b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.st svg{width:12px;height:12px;stroke:var(--tx3);fill:none;stroke-width:1.8;flex:none}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:9px}
.bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),#7c5cff)}
.foot{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--tx3)}
.foot .go{display:flex;align-items:center;gap:4px;color:var(--accent);opacity:0;transition:.2s}
.dc:hover .foot .go{opacity:1}
.foot .go svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.pill{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.2px}
.pill.ok{background:rgba(46,213,115,.14);color:var(--ok)}
.pill.warn{background:rgba(240,165,0,.15);color:var(--warn)}
.pill.bad{background:rgba(255,71,87,.15);color:var(--danger)}
.pill.na{background:var(--card-hi);color:var(--tx3)}
/* ── 时间线 ── */
.tl{display:flex;align-items:stretch;gap:7px;height:138px;padding:14px 16px;border-radius:13px;
  background:var(--card);border:1px solid var(--line)}
.tl .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tl .num{font-size:10.5px;color:var(--tx2);font-variant-numeric:tabular-nums;line-height:1}
.tl .track{flex:1;width:100%;display:flex;align-items:flex-end;min-height:0}
.tl .bx{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent),rgba(74,125,255,.30));
  min-height:4px;transition:.25s}
.tl .col:hover .bx{filter:brightness(1.3)}
.tl .lb{font-size:9.5px;color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums}
/* ── 下钻面板 ── */
.panel{position:fixed;inset:0;background:rgba(6,10,20,.62);backdrop-filter:blur(6px);
  display:none;align-items:flex-start;justify-content:center;padding:44px 20px;z-index:60;overflow:auto}
.panel.on{display:flex}
.pbox{width:100%;max-width:980px;background:var(--bg-grad1);border:1px solid var(--line-hi);
  border-radius:17px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden}
.phead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg-grad1);z-index:2}
.phead h3{font-size:16px;font-weight:640}
.phead p{font-size:11px;color:var(--tx3);margin-top:2px}
.search{flex:1;max-width:280px;display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;
  background:var(--card-hi);border:1px solid var(--line)}
.search svg{width:14px;height:14px;stroke:var(--tx3);fill:none;stroke-width:1.9;flex:none}
.search input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:12.5px;font-family:inherit}
.search input::placeholder{color:var(--tx3)}
.flist{padding:6px 10px 14px;max-height:62vh;overflow:auto}
.row{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;transition:.15s}
.row:hover{background:var(--card-hi)}
.fi{width:29px;height:29px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);font-size:9.5px;font-weight:700;letter-spacing:.2px}
.fi.doc{background:rgba(124,92,255,.14);color:#a78bfa}
.fi.img{background:rgba(46,213,115,.14);color:var(--ok)}
.fi.dat{background:rgba(240,165,0,.14);color:var(--warn)}
.rmain{flex:1;min-width:0}
.rmain .rn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain .rp{font-size:10.5px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{text-align:right;flex:none;font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums;line-height:1.6}
.dtag{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);
  font-size:9.5px;font-weight:600;margin-right:6px}
.empty{padding:40px;text-align:center;color:var(--tx3);font-size:12.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--tx3);padding:11px 16px;
  border-radius:11px;background:var(--card);border:1px solid var(--line);margin-top:12px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
</style>
</head>

  if(['.md','.txt'].includes(e)) return ['', 'MD'];
  if(['.html'].includes(e)) return ['doc','HTML'];
  return ['dat', e.replace('.','').slice(0,4).toUpperCase()];
}
function render(domName, q=''){
  let rows = DATA.files;
  if(domName) rows = rows.filter(f => f.d === domName);
  if(q) rows = rows.filter(f => f.n.toLowerCase().includes(q.toLowerCase()));
  if(!rows.length){ $('#flist').innerHTML = '<div class="empty">没有匹配的文件</div>'; return; }
  const cap = rows.slice(0, 400);
  $('#flist').innerHTML = cap.map(f => {
    const [cls, tag] = extCls(f.e);
    return `<div class="row">
      <div class="fi ${cls}">${tag}</div>
      <div class="rmain">
        <div class="rn">${domName ? '' : `<span class="dtag">${f.d}</span>`}${f.n}</div>
        <div class="rp">${f.p || ''}</div>
      </div>
      <div class="rmeta">${sz(f.s)}<br>${dt(f.t)}</div>
    </div>`;
  }).join('') + (rows.length > 400 ? `<div class="empty">仅显示前 400 条，共 ${rows.length} 条——用搜索框收窄</div>` : '');
}
$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.dc');
  if(!card) return;
  const d = DATA.domains[+card.dataset.i];
  $('#pTitle').textContent = d.name;
  $('#pSub').textContent = `${d.desc}　·　${nfmt(d.files)} 个文件　·　知识文本 ${d.chars ? nfmt(d.chars) : '—'}　·　最近 ${dt(d.last)}`;
  $('#q').value = '';
  render(d.name);
  $('#panel').classList.add('on');
});
$('#closeBtn').onclick = () => $('#panel').classList.remove('on');
$('#panel').addEventListener('click', e => { if(e.target.id === 'panel') $('#panel').classList.remove('on'); });
$('#q').oninput = e => render($('#pTitle').textContent, e.target.value);
document.addEventListener('keydown', e => { if(e.key === 'Escape') $('#panel').classList.remove('on'); });

/* 主题 */
const root = document.documentElement;
const qp = new URLSearchParams(location.search).get('theme');
if(qp) root.dataset.theme = qp;
else { const saved = localStorage.getItem('kb-theme'); if(saved) root.dataset.theme = saved; }
$('#themeBtn').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('kb-theme', root.dataset.theme);
};
</script>
</body>
